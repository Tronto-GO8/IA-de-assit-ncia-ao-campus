<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Assistente Virtual IFRS</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imagem/mini.jpg" type="imagem-jpg">
</head>

<body>

    <div class="painel">

        </header>

                <p>

                </p>

                <p>
                    Posso ajudar com duvidas sobre:
                </p>

                
                <ul>
                    <div class="sugestao">
                        <li>
                            <button class="sugestao-btn">

                                <span>

                                📚 Acadêmico 
                                    
                                </span>   

                                <span class="seta">

                                    ▶

                                </span>

                            <div class="submenu">

                                <button class="pergunta">
                                    Como faço matrícula?
                                </button>

                                <button class="pergunta">

                                </button>

                                <button class="pergunta">
                                    Editais
                                </button>

                                <button class="pergunta">

                                </button>

                                </button> 
                            </div>
                        
                        </li>

                        <li>
                            <button class="sugestao-btn">

                                <span>

                                </span>   

                                <span class="seta">

                                    ▶

                                </span>

                                <button class="pergunta">
                                    Quais cursos?

                                <button class="pergunta">

                                </button>

                                <button class="pergunta">
                                    Salas
                                </button>
                            </div>
                        </li>

                        <li>
                            <button class="sugestao-btn">

                                <span>

                                </span>   

                                <span class="seta">

                                    ▶

                                </span>

                            </button>
                            
                            <div class="submenu">

                                <button class="pergunta">

                                <button class="pergunta">

                                </button>

                                <button class="pergunta">
                                    Atraso no pagamento
                                </button>

                                <button class="pergunta">
                                    Editais
                                </button>
                            </div>
                        </li>
                           
                        <li>
                            <button class="sugestao-btn">

                                <span>

                                🏢 Estrutura
                                    
                                </span>   

                                <span class="seta">

                                    ▶

                                </span>

                            </button>

                            <div class="submenu">

                                <button class="pergunta">
                                   Horários das salas
                                </button>

                                <button class="pergunta">
                                    Horários dos professores
                                </button>

                                <button class="pergunta">
                                    Horários de atendimento
                                </button>

                                    Datas importantes

                        <li>

                                <span>

                                <span class="seta">

                                <button class="pergunta">

                    </div>
                </ul>

                        </p>

            <section
                class="lista-mensagens"
                id="listaMensagens">

            </section>

            <div
                class="digitando"
                id="digitando">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </main>

        <footer class="entrada">

            <input

                id="inputPergunta"

                type="text"

                placeholder="Digite sua pergunta..."

                autocomplete="off"

            >

            <button

                id="botaoEnviar"

                title="Enviar"

            >

                ➤

            </button>

        </footer>

    <script src="script.js"></script>
